name: Build unsigned IPA

# 自用、不上架：产出「未签名」IPA 作为 Actions 产物。
# CI 不接触任何证书 / Apple 账号 / App Store；下载后用 Sideloadly、AltStore、
# SideStore 或 Xcode 填自己的 Apple ID 签名安装即可（免费账号 7 天续签）。
on:
  workflow_dispatch:
    inputs:
      xcode_path:
        description: '可选：指定 Xcode 绝对路径（留空用 runner 默认）'
        required: false
        default: ''
      retention_days:
        description: '产物保留天数，1-90（默认 30）'
        required: false
        default: '30'
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'LICENSE'

permissions:
  contents: read

concurrency:
  group: unsigned-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Archive unsigned IPA
    # Capacitor 8 需要 Xcode 16+；macos-latest 预装的 Xcode 满足要求。
    # 若报 Xcode 版本过旧，手动触发时填 xcode_path（先用 ls /Applications 查）。
    runs-on: macos-latest
    timeout-minutes: 60

    env:
      ARCHIVE: ${{ runner.temp }}/RP-Hub.xcarchive
      DERIVED: ${{ runner.temp }}/DerivedData
      SPM: ${{ runner.temp }}/SourcePackages
      IPA_NAME: RP-Hub-0.2.2-unsigned-${{ github.run_number }}.ipa

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 环境与配置预检
        run: |
          set -eu
          echo "=== 工具链 ==="
          xcodebuild -version
          node --version
          npm --version
          echo "=== 工程配置一致性 ==="
          test -f package-lock.json || { echo "::error::缺少 package-lock.json，npm ci 会失败"; exit 1; }
          test -f ios/App/App.xcodeproj/xcshareddata/xcschemes/App.xcscheme || {
            echo "::error::缺少 shared scheme，xcodebuild -scheme App 会失败"; exit 1; }
          APPID=$(node -p "require('./capacitor.config.json').appId")
          PBX=$(grep -oE 'PRODUCT_BUNDLE_IDENTIFIER = [^;]+' ios/App/App.xcodeproj/project.pbxproj \
                | sed -E 's/.*= //' | tr -d '"' | sort -u | tr '\n' ' ' | sed 's/ *$//')
          echo "capacitor.config.json : $APPID"
          echo "project.pbxproj       : $PBX"
          [ "$PBX" = "$APPID" ] || {
            echo "::error::bundle id 不一致：请同时改 capacitor.config.json 的 appId 与 pbxproj 的两处 PRODUCT_BUNDLE_IDENTIFIER"; exit 1; }
          echo "APP_ID=$APPID" >> "$GITHUB_ENV"
          echo "APP_VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
          RET="${{ inputs.retention_days || 30 }}"
          case "$RET" in ''|*[!0-9]*) RET=30 ;; esac
          if [ "$RET" -lt 1 ] || [ "$RET" -gt 90 ]; then RET=30; fi
          echo "RETENTION=$RET" >> "$GITHUB_ENV"

      - name: 选择 Xcode（可选）
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.xcode_path }}" ]; then
            sudo xcode-select -s "${{ inputs.xcode_path }}"
          fi
          xcode-select -p
          XCODE_VER=$(xcodebuild -version | awk 'NR==1{print $2}')
          MAJOR=${XCODE_VER%%.*}
          echo "Xcode $XCODE_VER"
          case "$MAJOR" in
            ''|*[!0-9]*) ;;
            *) if [ "$MAJOR" -lt 16 ]; then
                 echo "::warning::Capacitor 8 建议 Xcode 16+，当前 $XCODE_VER；若 Archive 失败请指定 xcode_path"
               fi ;;
          esac

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 安装依赖（npm ci）
        run: npm ci

      - name: 单元测试
        run: npm test

      - name: Vite 构建 + 产物校验
        run: npm run build

      - name: 同步 Capacitor 原生工程
        run: |
          set -euo pipefail
          # Cap 8 用 SPM，无 Podfile；旧模板若带 Podfile 则兼容处理。
          if [ -f ios/App/Podfile ]; then
            (cd ios/App && pod install --repo-update)
          fi
          npx cap sync ios
          test -f ios/App/App/public/index.html
          cmp -s dist/index.html ios/App/App/public/index.html
          echo "cap sync OK：dist/ 与 ios/App/App/public/ 一致"

      - name: 解析 Swift Package 依赖
        # Package.swift 引用了远程 capacitor-swift-pm 与本地 node_modules/@capacitor/*，
        # 所以 npm ci 与 cap sync 必须在这一步之前完成。
        run: |
          xcodebuild -resolvePackageDependencies \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -derivedDataPath "$DERIVED" \
            -clonedSourcePackagesDirPath "$SPM"

      - name: Archive（不签名）
        run: |
          set -euo pipefail
          if [ -d "ios/App/App.xcworkspace" ]; then
            CONTAINER=(-workspace ios/App/App.xcworkspace)
          else
            CONTAINER=(-project ios/App/App.xcodeproj)
          fi
          xcodebuild "${CONTAINER[@]}" \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE" \
            -derivedDataPath "$DERIVED" \
            -clonedSourcePackagesDirPath "$SPM" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            archive

      - name: 打包未签名 IPA
        run: |
          set -euo pipefail
          APP=$(find "$ARCHIVE/Products/Applications" -maxdepth 1 -name '*.app' -type d -print -quit)
          [ -n "$APP" ] || { echo "::error::archive 里没有 .app"; exit 1; }
          test -f "$APP/Info.plist" || { echo "::error::.app 缺少 Info.plist"; exit 1; }
          echo "App: $APP"
          if codesign -dv "$APP" >/dev/null 2>&1; then
            echo "::warning::检测到签名信息（多为 ad-hoc），自签工具会重签，不影响使用"
          else
            echo "确认：未签名（符合预期）"
          fi
          STAGE="${{ runner.temp }}/ipa-stage"
          rm -rf "$STAGE" && mkdir -p "$STAGE/Payload"
          cp -R "$APP" "$STAGE/Payload/"
          IPA="$GITHUB_WORKSPACE/$IPA_NAME"
          rm -f "$IPA"
          (cd "$STAGE" && zip -qry "$IPA" Payload -x '*.DS_Store')
          unzip -Z1 "$IPA" > "${{ runner.temp }}/ipa-list.txt"
          grep -q '^Payload/[^/]*\.app/Info\.plist$' "${{ runner.temp }}/ipa-list.txt" || {
            echo "::error::IPA 结构异常，缺少 Payload/*.app/Info.plist"; exit 1; }
          unzip -t "$IPA" | tail -2
          ls -lh "$IPA"
          echo "IPA_SHA256=$(shasum -a 256 "$IPA" | awk '{print $1}')" >> "$GITHUB_ENV"
          echo "IPA_SIZE=$(du -h "$IPA" | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: RP-Hub-unsigned-IPA-${{ github.run_number }}
          path: ${{ env.IPA_NAME }}
          if-no-files-found: error
          retention-days: ${{ env.RETENTION }}

      - name: 构建摘要
        run: |
          {
            echo "### 未签名 IPA 已生成"
            echo ""
            echo "| 项 | 值 |"
            echo "| --- | --- |"
            echo "| 版本 | \`$APP_VERSION\` |"
            echo "| Bundle ID | \`$APP_ID\` |"
            echo "| 运行号 | #${{ github.run_number }} |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| 大小 | $IPA_SIZE |"
            echo "| SHA256 | \`$IPA_SHA256\` |"
            echo ""
            echo "下载产物 **RP-Hub-unsigned-IPA-${{ github.run_number }}** → 得到 \`$IPA_NAME\`。"
            echo ""
            echo "**下一步（自签）**：用 Sideloadly / AltStore / SideStore / Xcode 填自己的 Apple ID 签名后安装。"
            echo "此 IPA 未签名，不能直接装；免费账号签名有效期 7 天，续签请保持同一个 Bundle ID。"
          } >> "$GITHUB_STEP_SUMMARY"
